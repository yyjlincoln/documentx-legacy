# Main nginx config for running nginx as the unprivileged documentx user.
# Mirrors Debian's default /etc/nginx/nginx.conf minus `user` (needs root) and
# with the pid file moved to a writable location. Site config: nginx.conf.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
}

http {
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;

    gzip on;

    include /etc/nginx/conf.d/*.conf;
}
